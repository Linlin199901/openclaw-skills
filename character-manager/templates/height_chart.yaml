# 身高对照表模板
# 用于群像剧的角色身高参照系
# 用法：选择一个基准角色（通常是第一主角），以他/她为参照

项目: ""
基准角色: ""         # 名字
基准身高: 0.0        # cm

角色列表:
  - 姓名: ""
    身高: 0.0        # cm  
    差距描述: ""     # "比基准矮半个头" "头顶到基准眉毛" "与基准平齐"
    头顶位置: ""     # "基准的眉毛" "基准的下巴" "基准的鼻子"
  
  - 姓名: ""
    身高: 0.0
    差距描述: ""
    头顶位置: ""

# 可视化参照（ASCII 比例尺）
#   基准(XXXcm)  ━━━━━━━━━━━━━━
#   角色A(XXXcm) ━━━━━━
#   角色B(XXXcm) ━━━━━━━━━━
#   角色C(XXXcm) ━━━━━━━━━━━━━━━━

# 常见身高差对应的头顶位置速查（以 178cm 为基准）
# 188cm → 头顶到基准眉毛上方约3cm
# 178cm → 基准线
# 172cm → 头顶到基准眼睛
# 168cm → 头顶到基准眉毛
# 162cm → 头顶到基准鼻子
# 156cm → 头顶到基准下巴
# 150cm → 头顶到基准肩膀
