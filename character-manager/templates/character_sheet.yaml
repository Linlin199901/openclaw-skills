# 角色档案模板 (YAML)
# 使用：复制此文件，修改字段值，保存到 characters/<项目名>/<角色名>.yaml

---

# ── 基本信息 ──
角色:
  姓名: ""
  别名: []          # 外号/称号
  性别: ""
  年龄: ""          # 精确年龄或年龄范围
  所属项目: ""
  角色类型: ""       # 主角 / 女主 / 反派 / 导师 / 喜剧担当 / 路人 / 自定义
  一句话人设: ""     # 职业 × 性格 × 缺陷 → 核心张力

# ── 维度1：面部锚点（不可变） ──
面部:
  脸型: ""          # 鹅蛋脸 | 瓜子脸 | 圆脸 | 方脸 | 长脸 | 菱形脸
  脸型细节: ""       # 下颌线/颧骨/太阳穴的具体描述
  眼睛:
    类型: ""        # 杏仁眼 | 丹凤眼 | 桃花眼 | 圆眼 | 细长眼
    虹膜颜色: ""    # 深棕 | 浅棕 | 琥珀 | 黑 | 灰蓝 | 绿
    双眼皮: ""      # 有/无 + 宽度 mm
    内眼角: ""      # 尖/圆 + 其他特征
    眼距: ""        # 宽于/窄于/等于 一只眼长度
  眉毛:
    类型: ""        # 柳叶眉 | 剑眉 | 平眉 | 挑眉 | 八字眉
    颜色: ""        # 相对发色关系
    眉尾: ""        # 自然收细 | 上挑 | 下垂
  鼻子:
    鼻梁: ""        # 挺直 | 微驼峰 | 圆润
    鼻梁宽度: ""    # 宽/适中/窄
    鼻头: ""        # 小巧 | 圆润 | 尖 | 微翘
    鼻翼宽度: ""    # 宽于/窄于/等于 眼距
  嘴唇:
    上唇: ""        # 薄于/厚于/等于 下唇
    下唇: ""        # 
    唇色: ""        # 自然粉 | 淡粉 | 红润 | 苍白
    嘴角: ""        # 自然微扬 | 下垂 | 平直
  肤色:
    色调: ""        # 暖白皮 | 冷白皮 | 中性 | 小麦
    质感: ""        # 哑光 | 光泽 | 陶瓷
    瑕疵: ""        # 雀斑/痣/伤疤 位置+颜色
  发型:
    长度: ""        # cm + 相对身体参照
    颜色: ""
    样式: ""        # 直发/卷发(大卷/小卷)/波浪
    分线: ""        # 三七分/中分/偏分/无
    刘海: ""        # 无/齐刘海/空气刘海/斜刘海
    发尾: ""        # 齐平/渐变/参差
    特殊: ""        # 编发/挑染/渐变
  识别特征: ""      # 痣/疤痕/虎牙/酒窝/耳形 等永久特征

# ── 维度2：身高体态 ──
身体:
  身高: 0.0         # cm
  相对身高: ""       # 以第一主角为参照
  头身比: ""        # 约X头身
  肩宽: ""          # cm 范围
  骨架类型: ""      # 细骨架 | 中等骨架 | 宽骨架
  腿身比: ""         # 腿长约占总身高XX%
  胸腰臀比: ""
  腰线位置: ""      # 偏高 | 适中 | 偏低

# ── 维度3：体态签名 ──
体态:
  签名句: ""        # 一句人类可读的描述
  AI翻译: ""        # 英文物理描述，直接填入prompt
  默认站姿: ""
  走路姿态: ""
  坐下姿态: ""
  转头习惯: ""
  手势库:
    - 触发: ""       # 思考时
      动作: ""       # 右手食指敲太阳穴
    - 触发: ""
      动作: ""
    - 触发: ""
      动作: ""

# ── 维度4：服饰系统 ──
服饰:
  核心锚物:
    名称: ""        # 发簪/项坠/眼镜/戒指
    位置: ""        # 穿戴位置
    描述: ""        # 材质+形状+颜色+尺寸
    附注: ""        # 全80集不变，所有场景必出现
  配色DNA:
    主色: []        # 月白#F0F4F8 | 天青#7BA7BC ...
    辅色: []
    强调色: []
    禁用色: []      # 正红 | 明黄 | 玫红 ...
  材质偏好: []       # 纱 | 绸 | 棉麻 ...
  禁用材质: []       # 皮革 | 亮片 ...
  领口习惯: ""      # 立领 | 交领 | V领 | 圆领 + 露肤范围
  腰带: ""
  袖口: ""
  场景服饰:
    日常装: ""
    战斗装: ""
    正式装: ""
    寝衣: ""

# ── 维度5：动态形变 ──
动态:
  战斗施法:
    发力部位: ""
    重心转移: ""
    速度感: ""      # 快/中/慢
  奔跑:
    步幅变化: ""
    手臂变化: ""
  情绪激动:
    面部启动序: ""  # 哪个部位先动
    常见表现: ""
  躺卧:
    头发散落: ""
    身体曲线: ""

# ── 维度6：关系网络 ──
关系:
  矩阵: {}          # 角色名: {关系类型, 关键事件, 关系温度(1-10), 转折集数}

# ── 维度7：成长刻度 ──
成长:
  - 集数范围: "1-10"
    核心状态: ""
    关键变化: ""
  - 集数范围: "11-20"
    核心状态: ""
    关键变化: ""
  # ... 继续按10集一组扩展

# ── 元数据 ──
元数据:
  创建日期: ""
  最后修改: ""
  版本: "1.0.0"
  作者: ""
